<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForgeByte Tech - Privacy Policies</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 2.5rem;
            text-align: center;
        }

        p {
            margin-bottom: 30px;
            color: #cbd5f5;
            text-align: center;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            width: 90%;
            max-width: 900px;
        }

        .btn {
            padding: 15px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: 0.3s ease;
            text-decoration: none;
            text-align: center;
            display: block;
        }

        .btn-standard {
            background: #334155;
            color: #fff;
        }

        .btn-standard:hover {
            background: #475569;
            transform: translateY(-3px);
        }

        /* Special Featured Button */
        .btn-featured {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            font-size: 1.2rem;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.6);
        }

        .btn-featured:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(34, 197, 94, 0.9);
        }

        footer {
            margin-top: 40px;
            font-size: 0.9rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <h1>ForgeByte Tech</h1>
    <p>Privacy Policy Center</p>

    <div class="container">

        <!-- Featured App -->
        <a href="Card-Memory.html" class="btn btn-featured">
            🧠 Card Memory
        </a>

        <!-- Other Apps -->
        <a href="privacy-bill-check.html" class="btn btn-standard">
            Bill Check PK
        </a>

        <a href="privacy-tic-master.html" class="btn btn-standard">
            Tic Master
        </a>

        <a href="privacy-qr-scanner.html" class="btn btn-standard">
            QR & Barcode Scanner
        </a>

        <a href="privacy-calculator.html" class="btn btn-standard">
            Smart Calculator
        </a>

        <a href="privacy-notes.html" class="btn btn-standard">
            Notes Keeper
        </a>

    </div>

    <footer>
        © 2026 ForgeByte Tech. All rights reserved.
    </footer>

</body>
</html>
